<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accessible Interactive Photo Gallery</title>
    <link rel="stylesheet" href="style.css">
</head>

<body onload="addTabFocus()">

    <h1>Interactive Photo Gallery</h1>

    <div class="gallery">

        <img src="https://picsum.photos/id/1015/300/200"
             alt="Beautiful mountain landscape"
             tabindex="0"
             onmouseover="highlight(this)"
             onmouseleave="unhighlight(this)"
             onfocus="highlight(this)"
             onblur="unhighlight(this)">

        <img src="https://picsum.photos/id/1025/300/200"
             alt="Cute dog sitting outside"
             tabindex="0"
             onmouseover="highlight(this)"
             onmouseleave="unhighlight(this)"
             onfocus="highlight(this)"
             onblur="unhighlight(this)">

        <img src="https://picsum.photos/id/1035/300/200"
             alt="Calm beach with blue water"
             tabindex="0"
             onmouseover="highlight(this)"
             onmouseleave="unhighlight(this)"
             onfocus="highlight(this)"
             onblur="unhighlight(this)">

        <img src="https://picsum.photos/id/1043/300/200"
             alt="Forest road during autumn"
             tabindex="0"
             onmouseover="highlight(this)"
             onmouseleave="unhighlight(this)"
             onfocus="highlight(this)"
             onblur="unhighlight(this)">

        <img src="https://picsum.photos/id/1050/300/200"
             alt="Snow covered mountains"
             tabindex="0"
             onmouseover="highlight(this)"
             onmouseleave="unhighlight(this)"
             onfocus="highlight(this)"
             onblur="unhighlight(this)">

        <img src="https://picsum.photos/id/1069/300/200"
             alt="City skyline at night"
             tabindex="0"
             onmouseover="highlight(this)"
             onmouseleave="unhighlight(this)"
             onfocus="highlight(this)"
             onblur="unhighlight(this)">

    </div>

    <div id="image">
        Hover over or focus on an image to display details.
    </div>

    <script src="script.js"></script>

</body>
</html>
